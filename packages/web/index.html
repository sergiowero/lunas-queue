<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LunasQ</title>
    <script>
      // Tema antes de montar React, sin destello de claro. Misma regla y clave que src/lib/theme.ts.
      (() => {
        let theme = null;
        try {
          const stored = localStorage.getItem("lunasq:theme");
          if (stored === "light" || stored === "dark") theme = stored;
        } catch {}
        try {
          if (!theme && window.matchMedia?.("(prefers-color-scheme: dark)").matches) theme = "dark";
        } catch {}
        if (theme === "dark") document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
